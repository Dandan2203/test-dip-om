stages:
  - test
  - build

# ── Go ──────────────────────────────────────────────────────────────────────
go-test:
  stage: test
  image: golang:1.25-alpine
  script:
    - cd backend
    - go test ./...

# ── Python ──────────────────────────────────────────────────────────────────
python-lint:
  stage: test
  image: python:3.13-slim
  script:
    - pip install --quiet ruff
    - cd financial-ai-agent && ruff check . --select=E,F --ignore=E501

# ── Docker builds (лише гілка main) ─────────────────────────────────────────
.docker-build: &docker-build
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker info
  only:
    - main

build-backend:
  <<: *docker-build
  script:
    - docker build -t finagent/backend:$CI_COMMIT_SHORT_SHA ./backend

build-ai:
  <<: *docker-build
  script:
    - docker build -t finagent/ai:$CI_COMMIT_SHORT_SHA ./financial-ai-agent

build-frontend:
  <<: *docker-build
  script:
    - docker build -t finagent/frontend:$CI_COMMIT_SHORT_SHA ./frontend
